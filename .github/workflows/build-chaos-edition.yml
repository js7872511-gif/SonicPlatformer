name: Build Sonic 3 A.I.R. Chaos Edition APK

on:
  push:
    branches: [chaos-edition-build]
    paths:
      - 'chaos-edition/**'
      - 'docs/superpowers/plans/**'
      - '.github/workflows/build-chaos-edition.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Chaos Edition patch
        uses: actions/checkout@v4

      - name: Run Chaos Edition patch tests
        run: python3 -m unittest discover -s chaos-edition/tests -v

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ cmake xvfb \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libxcomposite-dev libxxf86vm-dev \
            libcurl4-openssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, build tools, CMake and exact NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;29.0.14206865'

      - name: Checkout matching Sonic 3 A.I.R. stable source
        run: |
          git clone --depth 1 --branch v26.03.28.0-stable https://github.com/Eukaryot/sonic3air.git sonic3air-upstream

      - name: Download matching official Android APK for game assets
        run: |
          curl -L --fail --retry 3 \
            -o official-sonic3air.apk \
            https://github.com/Eukaryot/sonic3air/releases/download/v26.03.28.0-stable/sonic3air_game.apk
          echo '915fbf525efadfff06ed27923f8aead490ff29723b87445fbf172e1a4b476838  official-sonic3air.apk' | sha256sum -c -

      - name: Copy official game assets into source trees
        run: |
          rm -rf extracted-apk
          mkdir extracted-apk
          unzip -q official-sonic3air.apk 'assets/*' -d extracted-apk

          mkdir -p sonic3air-upstream/Oxygen/sonic3air/build/_android/app/src/main/assets
          cp -a extracted-apk/assets/. sonic3air-upstream/Oxygen/sonic3air/build/_android/app/src/main/assets/

          mkdir -p sonic3air-upstream/Oxygen/sonic3air/data
          cp -a extracted-apk/assets/data/. sonic3air-upstream/Oxygen/sonic3air/data/

      - name: Apply Chaos Edition native touch patch
        run: |
          python3 chaos-edition/patch_touch_controls.py sonic3air-upstream
          grep -n 'comfortable layout v0.2' sonic3air-upstream/Oxygen/oxygenengine/source/oxygen/application/overlays/TouchControlsOverlay.cpp

      - name: Apply Chaos Edition v0.3 save-bank patch
        run: |
          python3 chaos-edition/patch_save_banks.py sonic3air-upstream
          grep -n 'global u8 chaos.save_bank' sonic3air-upstream/Oxygen/sonic3air/scripts/general/saveslots.lemon
          grep -n 'CHAOS SAVES 1-8' sonic3air-upstream/Oxygen/sonic3air/scripts/menus/dataselect.lemon
          grep -n 'ring_counter = 999' sonic3air-upstream/Oxygen/sonic3air/scripts/general/saveslots.lemon

      - name: Build Linux development executable for LemonScript compiler
        working-directory: sonic3air-upstream/Oxygen/sonic3air
        run: |
          mkdir -p build/_cmake/build
          cd build/_cmake/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . -j 4
          test -x ../../../sonic3air_linux

      - name: Regenerate patched scripts.bin
        working-directory: sonic3air-upstream/Oxygen/sonic3air
        run: |
          rm -rf saves
          mkdir -p saves
          STOCK_SHA=$(sha256sum ../../../extracted-apk/assets/data/scripts.bin | awk '{print $1}')
          xvfb-run -a ./sonic3air_linux -dumpcppdefinitions -nativize
          test -s saves/scripts.bin
          PATCHED_SHA=$(sha256sum saves/scripts.bin | awk '{print $1}')
          echo "stock scripts.bin:   $STOCK_SHA"
          echo "patched scripts.bin: $PATCHED_SHA"
          test "$STOCK_SHA" != "$PATCHED_SHA"
          cp saves/scripts.bin build/_android/app/src/main/assets/data/scripts.bin
          echo "$PATCHED_SHA" > /tmp/patched_scripts_sha.txt

      - name: Configure separate Chaos Edition v0.3 app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sonic3air-upstream/Oxygen/sonic3air/build/_android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionName "26.03.28.0"', 'versionName "26.03.28.0-chaos3"')
          s = s.replace("abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'", "abiFilters 'arm64-v8a'")
          marker = 'defaultConfig {\n'
          if 'applicationId "com.chaosed.sonic3air.v3"' not in s:
              s = s.replace(marker, marker + '        applicationId "com.chaosed.sonic3air.v3"\n', 1)
          p.write_text(s)
          PY
          grep -RIl 'Sonic 3 A.I.R.' sonic3air-upstream/Oxygen/sonic3air/build/_android/app/src/main/res | xargs -r sed -i 's/Sonic 3 A.I.R./S3AIR Chaos Edition v0.3/g'

      - name: Build unsigned release APK
        working-directory: sonic3air-upstream/Oxygen/sonic3air/build/_android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Align and sign Chaos Edition APK
        run: |
          UNSIGNED=$(find sonic3air-upstream/Oxygen/sonic3air/build/_android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$UNSIGNED"
          keytool -genkeypair -v \
            -keystore chaos-edition.keystore \
            -storepass chaosair -keypass chaosair \
            -alias chaos-edition -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Chaos Edition v0.3, O=Private Build, C=US'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -p -f 4 "$UNSIGNED" S3AIR_Chaos_Edition_v0.3.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks chaos-edition.keystore \
            --ks-key-alias chaos-edition \
            --ks-pass pass:chaosair --key-pass pass:chaosair \
            S3AIR_Chaos_Edition_v0.3.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs S3AIR_Chaos_Edition_v0.3.apk
          sha256sum S3AIR_Chaos_Edition_v0.3.apk > S3AIR_Chaos_Edition_v0.3.apk.sha256

      - name: Verify patched script asset is inside APK
        run: |
          rm -rf verify-apk
          mkdir verify-apk
          unzip -q S3AIR_Chaos_Edition_v0.3.apk assets/data/scripts.bin -d verify-apk
          EXPECTED=$(cat /tmp/patched_scripts_sha.txt)
          ACTUAL=$(sha256sum verify-apk/assets/data/scripts.bin | awk '{print $1}')
          echo "expected scripts.bin: $EXPECTED"
          echo "APK scripts.bin:      $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Upload Chaos Edition APK
        uses: actions/upload-artifact@v4
        with:
          name: S3AIR-Chaos-Edition-v0.3
          path: |
            S3AIR_Chaos_Edition_v0.3.apk
            S3AIR_Chaos_Edition_v0.3.apk.sha256
          if-no-files-found: error
