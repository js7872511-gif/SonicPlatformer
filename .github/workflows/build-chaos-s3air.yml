name: Build Sonic 3 AIR Chaos Edition Engine

on:
  push:
    branches: [chaos-edition-build]
    paths:
      - 'chaos-edition/**'
      - '.github/workflows/build-chaos-s3air.yml'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK pieces
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.22.1'

      - name: Fetch matching Sonic 3 AIR source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Eukaryot/sonic3air.git sonic3air
          cd sonic3air
          git checkout b0063dfb4b3e69d710e131ab83507cdf8c41910f

      - name: Apply Chaos Edition touch patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 chaos-edition/patch_s3air.py
          grep -R "Chaos Edition" -n \
            sonic3air/Oxygen/oxygenengine/source/oxygen/application/overlays/TouchControlsOverlay.cpp \
            sonic3air/Oxygen/oxygenengine/source/oxygen/application/input/ControlsIn.cpp

      - name: Build arm64 native engine
        shell: bash
        run: |
          set -euxo pipefail
          cd sonic3air/Oxygen/sonic3air/build/_android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect libmain.so
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p chaos-out
          LIB="$(find sonic3air/Oxygen/sonic3air/build/_android/app/build -type f -path '*/arm64-v8a/libmain.so' | head -n 1)"
          test -n "$LIB"
          cp "$LIB" chaos-out/libmain.so
          file chaos-out/libmain.so
          ls -lh chaos-out/libmain.so

      - name: Upload arm64 engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaos-s3air-arm64-libmain
          path: chaos-out/libmain.so
          if-no-files-found: error
          retention-days: 7
