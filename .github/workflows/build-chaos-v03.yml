name: Build Chaos Edition v0.3 APK

on:
  push:
    branches:
      - chaos-edition-build
    paths:
      - 'chaos-edition/**'
      - '.github/workflows/build-chaos-v03.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Chaos Edition v0.3
        run: bash chaos-edition/build_v03_ci.sh

      - name: Upload compiler diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-v0.3-compiler-log
          path: lemon-compiler.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S3AIR-Chaos-Edition-v0.3
          path: |
            S3AIR_Chaos_Edition_v0.3.apk
            S3AIR_Chaos_Edition_v0.3.apk.sha256
          if-no-files-found: error
