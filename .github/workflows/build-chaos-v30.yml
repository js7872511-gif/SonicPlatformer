name: Build Chaos Edition 3.0 APK

on:
  push:
    branches:
      - chaos-edition-v3-finalwork
    paths:
      - 'chaos-edition/**'
      - '.github/workflows/build-chaos-v30.yml'
      - 'docs/superpowers/specs/2026-10-29-chaos-edition-3.0.md'
      - 'docs/superpowers/plans/2026-10-29-chaos-edition-3.0.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Chaos Edition 3.0
        run: bash chaos-edition/build_v30_ci.sh

      - name: Upload compiler diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-3.0-compiler-log
          path: lemon-compiler-v30.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S3AIR-Chaos-Edition-3.0
          path: |
            S3AIR_Chaos_Edition_3.0.apk
            S3AIR_Chaos_Edition_3.0.apk.sha256
          if-no-files-found: error
