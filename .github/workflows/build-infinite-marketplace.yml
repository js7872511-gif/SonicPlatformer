name: Build Infinite Marketplace APK

on:
  push:
    branches:
      - infinite-marketplace
    paths:
      - 'infinite-marketplace-android/**'
      - '.github/workflows/build-infinite-marketplace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: infinite-marketplace-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: infinite-marketplace-debug-apk
          path: infinite-marketplace-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
