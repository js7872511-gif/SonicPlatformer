name: Build SonicPlatformer Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Generate packaging-safe base assets
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/generate_assets.py
          file resources/sonic/*.png

      - name: Apply v0.5 animation runtime
        run: python3 tools/patch_v05.py

      - name: Apply v0.5.1 gameplay fixes
        run: python3 tools/patch_v051.py

      - name: Apply v0.5.2 ground fixes
        run: python3 tools/patch_v052.py

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v7
        with:
          name: SonicPlatformer-v0.5.2-Android64
          path: ${{ steps.build.outputs.build-output }}
