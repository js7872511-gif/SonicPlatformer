name: Build Sonic Redux Re-born APK
on:
  push:
    branches: [reborn-apk-build, reborn-v0.2-runtime]
  workflow_dispatch:

concurrency:
  group: reborn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reborn-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate embedded Re-born game signing identity
        run: |
          mkdir -p app/src/main/res/raw
          openssl genrsa -out /tmp/reborn.pem 2048
          openssl pkcs8 -topk8 -nocrypt -in /tmp/reborn.pem -outform DER -out app/src/main/res/raw/reborn_key.pk8
          openssl req -new -x509 -key /tmp/reborn.pem -outform DER -out app/src/main/res/raw/reborn_cert.der -days 3650 -subj '/CN=Sonic Redux Re-born/O=Local Mod Build/'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build runtime payload
        run: |
          gradle :runtime-payload:assembleRelease --stacktrace
          AAR=runtime-payload/build/outputs/aar/runtime-payload-release.aar
          unzip -l "$AAR" | tee /tmp/runtime-aar.txt
          grep -F 'jni/arm64-v8a/libmain.so' /tmp/runtime-aar.txt
          grep -F 'jni/arm64-v8a/libreborn.so' /tmp/runtime-aar.txt
          grep -F 'jni/armeabi-v7a/libmain.so' /tmp/runtime-aar.txt
          grep -F 'jni/armeabi-v7a/libreborn.so' /tmp/runtime-aar.txt
          unzip -p "$AAR" classes.jar > /tmp/runtime-classes.jar
          unzip -l /tmp/runtime-classes.jar | grep -F 'com/sonicredux/reborn/runtimeui/RebornVisualBridge.class'
          unzip -p "$AAR" jni/arm64-v8a/libreborn.so > /tmp/libreborn.so
          strings /tmp/libreborn.so > /tmp/reborn-native-strings.txt
          grep -F 'on-demand Super visual bridge ready' /tmp/reborn-native-strings.txt
          grep -F 'gold override applied to %zu materials' /tmp/reborn-native-strings.txt
          grep -F 'IL2CPP visual bridge deferred until GO SUPER' /tmp/reborn-native-strings.txt
          if grep -Fq 'KorokScript.OnInvincible hook installed' /tmp/reborn-native-strings.txt; then
            echo 'Unsafe startup MethodInfo hook is still present' >&2
            exit 1
          fi
          if grep -Fq 'requested real Super renderer' /tmp/reborn-native-strings.txt; then
            echo 'Unsafe background state-sync bridge is still present' >&2
            exit 1
          fi
      - name: Build manager APK
        run: gradle assembleDebug --stacktrace
      - name: Static APK checks
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.sonicredux.reborn'" /tmp/badging.txt
          grep -F "versionName='0.2.2-beta3'" /tmp/badging.txt
          grep -F "application-label:'Sonic Redux Re-born'" /tmp/badging.txt
          "$BT/apksigner" verify --verbose "$APK" | tee /tmp/apksig.txt
          grep -F "Verified using v1 scheme (JAR signing): true" /tmp/apksig.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksig.txt
          unzip -l "$APK" | tee /tmp/manager-apk.txt
          grep -F 'assets/reborn-runtime/classes.dex' /tmp/manager-apk.txt
          grep -F 'assets/reborn-runtime/arm64-v8a/libmain.so' /tmp/manager-apk.txt
          grep -F 'assets/reborn-runtime/arm64-v8a/libreborn.so' /tmp/manager-apk.txt
          grep -F 'assets/reborn-runtime/armeabi-v7a/libmain.so' /tmp/manager-apk.txt
          grep -F 'assets/reborn-runtime/armeabi-v7a/libreborn.so' /tmp/manager-apk.txt
          unzip -p "$APK" assets/reborn-runtime/classes.dex | strings | grep -F 'RebornVisualBridge'
          unzip -p "$APK" assets/reborn-runtime/classes.dex | strings | grep -F 'invokeOnMainThread'
      - name: Package artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Sonic_Redux_Re-born_v0.2_Beta3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sonic-Redux-Re-born-v0.2-Beta3
          path: reborn-android/Sonic_Redux_Re-born_v0.2_Beta3.apk
