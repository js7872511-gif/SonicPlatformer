plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sonicredux.reborn'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sonicredux.reborn'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
