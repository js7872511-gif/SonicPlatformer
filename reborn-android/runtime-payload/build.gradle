plugins {
    id 'com.android.library'
}

android {
    namespace 'com.sonicredux.reborn.runtimepayload'
    compileSdk 35

    defaultConfig {
        minSdk 23
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
